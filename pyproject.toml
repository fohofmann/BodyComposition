[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BodyComposition"
version = "1.0.0rc1"
description = "Reproducible CT body-composition research pipeline with orientation, vertebral, measurement, QC, and reporting stages."
authors = [
    { name = "Felix Hofmann", email = "felix.hofmann@med.lmu.de" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.11,<3.12"
keywords = ["segmentation", "muscle", "adipose tissue", "medical imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "huggingface_hub",
    "jsonschema>=4.23,<5",
    "nibabel",
    "numpy",
    "opencv-python-headless",
    "pandas",
    "pyarrow",
    "pypdf>=6.15.0,<7",
    "reportlab>=4.4,<5",
    "psutil",
    "PyYAML>=6,<7",
    "requests>=2.32.4,<3",
    "urllib3>=2.7,<3",
    "scipy",
    "scikit-image",
    "SimpleITK",
    "SPINEPS==2.0.0",
    "TPTBox==0.7.5",
    "nnunetv2==2.5.2",
    "torch==2.13.0",
    "torchvision==0.28.0"
]

[project.optional-dependencies]
test = [
    "build>=1.2,<2",
    "mypy>=1.17,<2",
    "pdfplumber>=0.11,<0.12",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1"
]
release = [
    "pip-audit==2.10.1"
]

[project.urls]
Homepage = "https://github.com/fohofmann/BodyComposition"
Source = "https://github.com/fohofmann/BodyComposition"
Issues = "https://github.com/fohofmann/BodyComposition/issues"

[project.scripts]
bodycomposition = "BodyComposition.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BodyComposition*"]
namespaces = true

[tool.setuptools.package-data]
BodyComposition = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "model_integration: requires pinned model assets and a controlled GPU environment",
    "real_world: runs the default models on a checksum-pinned public CT in a controlled GPU environment"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]
files = [
    "BodyComposition/config.py",
    "BodyComposition/results.py",
    "BodyComposition/provenance.py",
    "BodyComposition/dicom.py",
    "BodyComposition/service.py",
    "BodyComposition/model_manager.py",
    "BodyComposition/cli.py",
    "BodyComposition/tissue_backends/boa.py",
    "BodyComposition/tissue_backends/boa_assets.py",
]

[[tool.mypy.overrides]]
module = ["SimpleITK", "pandas", "yaml"]
ignore_missing_imports = true

[tool.coverage.run]
# Measure the complete package. Model/GPU execution remains a separate test
# lane, but package-owned adapters and failure paths stay in this denominator.
branch = true
source = ["BodyComposition"]

[tool.coverage.report]
# coverage.py applies this floor to combined statement and branch opportunities.
fail_under = 80
precision = 1
show_missing = true
