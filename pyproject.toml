[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BodyComposition"
version = "0.3.0"
description = "Pipeline for the segmentation of muscle and adipose tissue with postprocessing for mapping to vertebral levels and calculation of cross-sectional areas."
authors = [
    { name = "Felix Hofmann", email = "felix.hofmann@med.lmu.de" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.11,<3.12"
keywords = ["segmentation", "muscle", "adipose tissue", "medical imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "huggingface_hub",
    "jsonschema>=4.23,<5",
    "nibabel",
    "numpy",
    "opencv-python-headless",
    "pandas",
    "pyarrow",
    "pypdf>=6,<7",
    "reportlab>=4.4,<5",
    "psutil",
    "pydicom",
    "requests == 2.27.1",
    "scipy",
    "scikit-image",
    "SimpleITK",
    "SPINEPS==2.0.0",
    "TPTBox==0.7.5",
    "tqdm",
    "nnunet",
    "nnunetv2",
    "torch",
    "torchvision",
    "TotalSegmentator==2.15.0"
]

[project.optional-dependencies]
test = [
    "pdfplumber>=0.11,<0.12",
    "pytest>=8,<10"
]

[project.urls]
Homepage = "https://github.com/fohofmann/BodyComposition"
Source = "https://github.com/fohofmann/BodyComposition"
Issues = "https://github.com/fohofmann/BodyComposition/issues"

[project.scripts]
bodycomposition = "BodyComposition.bin.run_batch:main"
bodycomposition_download_models = "BodyComposition.bin.pre_download_models:main"
bodycomposition_measurements = "BodyComposition.bin.measurement_view:main"
bodycomposition_reports = "BodyComposition.bin.reporting:main"
bodycomposition_segmentation = "BodyComposition.bin.run_segmentation_only:main"
bodycomposition_transform_dcm_to_nifti = "BodyComposition.bin.pre_transform_dcm_to_nifti:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BodyComposition*"]
namespaces = true

[tool.setuptools.package-data]
BodyComposition = ["schemas/*.json", "utils/licenses.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model_integration: requires pinned model assets and a controlled GPU environment",
    "real_world: runs the default models on a checksum-pinned public CT in a controlled GPU environment"
]
